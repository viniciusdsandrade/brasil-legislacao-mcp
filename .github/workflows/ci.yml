name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    name: Typecheck, testes e build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instala o ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Instala as dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Testes
        run: npm test

      - name: Executa a CLI
        run: node dist/cli.js --version && node dist/cli.js --help
