name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    name: Typecheck, testes e build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instala o ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Instala as dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Testes
        run: npm test

      - name: Executa a CLI
        run: node dist/cli.js --version && node dist/cli.js --help

      - name: Empacota e executa o pacote com npx
        run: |
          npm pack --silent
          pacote="$PWD/$(ls leis-mcp-*.tgz)"
          cd "$(mktemp -d)"
          npm exec --yes --package="$pacote" -- leis-mcp --version
          # Um caminho de arquivo que existe vira comando no npx; o spec file: é lido como pacote, como a URL da release.
          npx -y "file:$pacote" --version

  npm-12:
    name: Pacote por URL com o npm 12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # O npm 12 recusa pacotes de URL por padrão (allow-remote=none) e bloqueia scripts de instalação.
      - name: Instala o npm 12
        run: npm install -g npm@12 && npm --version

      - name: Instala as dependências
        run: npm ci

      - name: Executa o pacote por URL, como a documentação manda
        run: |
          npm pack --silent
          pacote="$(ls leis-mcp-*.tgz)"
          python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &
          servidor=$!
          trap 'kill "$servidor"' EXIT
          for _ in $(seq 1 30); do curl -fsI "http://127.0.0.1:8765/$pacote" >/dev/null && break; sleep 1; done
          cd "$(mktemp -d)"
          npx -y --allow-remote=all "http://127.0.0.1:8765/$pacote" --version
