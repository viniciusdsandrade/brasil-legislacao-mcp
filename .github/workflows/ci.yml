name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    name: Typecheck, testes e build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instala o ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Instala as dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Testes
        run: npm test

      - name: Executa a CLI
        run: node dist/cli.js --version && node dist/cli.js --help

      - name: Empacota e executa o pacote com npx
        run: |
          npm pack --silent
          pacote="$PWD/$(ls leis-mcp-*.tgz)"
          cd "$(mktemp -d)"
          npm exec --yes --package="$pacote" -- leis-mcp --version
          # Um caminho de arquivo que existe vira comando no npx; o spec file: é lido como pacote, como a URL da release.
          npx -y "file:$pacote" --version
